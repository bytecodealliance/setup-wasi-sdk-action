# This workflow demonstrates how to use the `setup-wasi-sdk` action from CMake projects. The WASI
# SDK comes bundled with a `*.cmake` file that makes this relatively easy.

name: cmake-compatible

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions: {}

jobs:
  cmake:
    name: Example
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./

      - name: Create CMake project
        run: |
          mkdir cmake-test
          cd cmake-test

          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(HelloWasm C)

          add_executable(hello hello.c)
          EOF

          cat > hello.c << 'EOF'
          #include <stdio.h>

          int main() {
              printf("Hello from CMake + WASI!\n");
              return 0;
          }
          EOF

      - name: Build with CMake
        run: |
          cd cmake-test
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$WASI_SDK_PATH/share/cmake/wasi-sdk.cmake"
          cmake --build build
          ls -la build/hello
          file build/hello
