name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (for example, v1.0.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must match vMAJOR.MINOR.PATCH (for example, v1.0.0)" >&2
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "checked-out commit does not match origin/main" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION"; then
            echo "tag $RELEASE_VERSION already exists and will not be overwritten" >&2
            exit 1
          fi

          echo "major=${RELEASE_VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./install.py --test-only --verbose

      - name: Create and push tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          MAJOR_VERSION: ${{ steps.release.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_VERSION" --message "Release $RELEASE_VERSION"
          git tag --annotate --force "$MAJOR_VERSION" \
            --message "Release $MAJOR_VERSION ($RELEASE_VERSION)"
          gh auth setup-git
          git push --atomic origin \
            "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION" \
            "+refs/tags/$MAJOR_VERSION:refs/tags/$MAJOR_VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "$RELEASE_VERSION" --verify-tag --generate-notes --title "$RELEASE_VERSION"
