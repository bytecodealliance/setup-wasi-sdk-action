# This workflow runs the cross-platform tests for the `setup-wasi-sdk` action.

name: cross-platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions: {}

jobs:
  cross_platform:
    name: Test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # SDK 23 introduced ARM64 on Linux and macOS (which also changed the URL format to its current form).
        # SDK 26 introduced Windows on ARM64.
        # arm64-linux, arm64-macos, arm64-windows, x86_64-linux, x86_64-macos, x86_64-windows
        os: [ubuntu-24.04-arm, macos-latest, windows-11-arm, ubuntu-latest, macos-15-intel, windows-latest]
        version: ['26', 'latest']
        include:
          - os: ubuntu-latest
            version: '34.0-rc.2'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install WASI SDK
        id: wasi-sdk
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Check output variables
        shell: bash
        env:
          CLANG_PATH: ${{ steps.wasi-sdk.outputs.clang-path }}
          SDK_PATH: ${{ steps.wasi-sdk.outputs.wasi-sdk-path }}
          SDK_VERSION: ${{ steps.wasi-sdk.outputs.wasi-sdk-version }}
          SYSROOT_PATH: ${{ steps.wasi-sdk.outputs.sysroot-path }}
        run: |
          echo "wasi-sdk-path: $SDK_PATH"
          echo "wasi-sdk-version: $SDK_VERSION"
          echo "clang-path: $CLANG_PATH"
          echo "sysroot-path: $SYSROOT_PATH"

      # This should print a wasi-sdk version because `add-to-path` is true by default.
      - name: Check Clang version
        run: clang --version

      # These should be set because `add-to-path` is true by default.
      - name: Check environment variables
        shell: bash
        run: |
          echo "WASI_SDK_PATH: $WASI_SDK_PATH"
          echo "CC: $CC"
          echo "CXX: $CXX"

      - name: Create test C program
        shell: bash
        run: |
          cat > hello.c << 'EOF'
          #include <stdio.h>

          int main() {
              printf("Hello, WebAssembly!\n");
              return 0;
          }
          EOF

      - name: Build WebAssembly module
        shell: bash
        run: |
          clang hello.c -o hello.wasm
          ls -la hello.wasm
          file hello.wasm

      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: '47.0.3'

      - name: Test WebAssembly module
        run: wasmtime hello.wasm
